name: Publish GHCR image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Verify ECA frontend branding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify branding regressions
        run: bun run test src/branding/eca/__tests__

      - name: Check changed frontend files
        run: |
          bun run typecheck
          bunx --no-install oxlint -c .oxlintrc.json rsbuild.config.ts scripts/verify-favicon.mjs src/branding/eca/__tests__/defaults.test.ts
          bunx --no-install oxfmt -c .oxfmtrc.json --check rsbuild.config.ts scripts/verify-favicon.mjs src/branding/eca/__tests__/defaults.test.ts package.json index.html

      - name: Build and verify the emitted favicon
        run: bun run build

  build:
    name: Build and push linux/amd64
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: newapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-ci-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: newapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d newapi"
          --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go for allowance regression tests
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Verify internal allowance before publishing
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
        run: go test ./model ./service -run 'Test(Eca|SystemTaskScheduler)' -count=1

      - name: Verify SQLite, MySQL, and PostgreSQL compatibility
        env:
          GOWORK: 'off'
          CGO_ENABLED: '0'
          TEST_MYSQL_DSN: 'root:isolated-ci-only@tcp(127.0.0.1:3306)/newapi?charset=utf8mb4&parseTime=True&loc=Local'
          AUDIT_MYSQL_DSN: 'root:isolated-ci-only@tcp(127.0.0.1:3306)/newapi?charset=utf8mb4&parseTime=True&loc=Local'
          TEST_POSTGRES_DSN: 'postgres://postgres:isolated-ci-only@127.0.0.1:5432/newapi?sslmode=disable'
          AUDIT_POSTGRES_DSN: 'postgres://postgres:isolated-ci-only@127.0.0.1:5432/newapi?sslmode=disable'
        run: |
          go test -p 1 -count=1 -timeout 15m -v ./model
          go test -p 1 -count=1 -timeout 15m -v ./controller -run '^(TestAPITokenAuditDatabaseMatrix|TestAuditDatabaseMatrix|TestDeleteRedemptionBatch|TestDisableFactoryOverrideRowSuppressesBothLayers|TestExecuteTaskSubmissionDisconnectAfterDurableInsertDoesNotRefund|TestIndependentAuditLogStores|TestModelDeletionDatabaseMatrix|TestModelManagementDatabaseMatrix|TestModelPricingConversionDatabaseMatrix|TestPreConsumePolicyDatabaseMatrix|TestRequestPolicyRoutingDatabaseMatrix|TestSharedModelPluginPricingDatabaseMatrix|TestTokenMigrationFromChar48ToVarchar128MySQL|TestTokenMigrationFromChar48ToVarchar128Postgres|TestVendorManagementDatabaseMatrix)$'

      - name: Stop regression databases before building
        run: docker stop '${{ job.services.mysql.id }}' '${{ job.services.postgres.id }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ranshen1209/eca-new-api
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
